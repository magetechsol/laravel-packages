name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']

    name: PHP $php - Laravel $laravel

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: $php
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite
          coverage: none

      - name: Install Dependencies
        run: |
          composer require "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer install --no-interaction --prefer-dist

      - name: Run Tests
        run: vendor/bin/pest

      - name: Run Static Analysis
        run: vendor/bin/phpstan analyse --memory-limit=4G
